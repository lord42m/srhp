<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Homepage ❤️</title>

  <style>
    :root {
      --bg: #0f1115;
      --accent: #ff7a9c;
      --text: #e6e6e6;
      --muted: #a0a0a0;
      --surface: #171a21;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      font-family: "Inter", "Segoe UI", sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 🌌 Stars */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: twinkle 4s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%,100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    /* ✨ Glow */
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(
        circle,
        rgba(255,122,156,0.18) 0%,
        rgba(255,122,156,0.08) 35%,
        rgba(255,122,156,0.02) 55%,
        transparent 70%
      );
      filter: blur(90px);
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 700px;
      text-align: center;
      padding: 20px;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 26px;
      font-weight: 500;
      min-height: 34px;
      text-shadow: 0 0 25px rgba(255,122,156,0.25);
    }

    h1 span { color: var(--accent); }

    .time {
      font-size: 48px;
      font-weight: 600;
      margin: 15px 0 5px;
      text-shadow: 0 0 30px rgba(255,122,156,0.25);
    }

    .date {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .search-box {
      max-width: 520px;
      margin: 25px auto;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 30px;
      border: none;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }

    .search-box input:focus {
      box-shadow: 0 0 0 2px rgba(255,122,156,0.3);
    }

    .message {
      margin: 30px 0;
      font-size: 16px;
      min-height: 52px;
    }

    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px 22px;
      border-radius: 25px;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent);
      color: #000;
    }

    .links {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .links-row {
      display: flex;
      gap: 16px;
    }

    .links a {
      border: 1px solid var(--muted);
      padding: 8px 18px;
      border-radius: 20px;
      color: var(--muted);
      text-decoration: none;
    }

    .links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      background: var(--surface);
      padding: 26px;
      border-radius: 16px;
      max-width: 300px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="glow"></div>

  <div class="container">
    <h1 id="greeting"></h1>

    <div class="time" id="time"></div>
    <div class="date" id="date"></div>

    <form class="search-box" action="https://www.google.com/search">
      <input name="q" placeholder="Search Google…" autofocus />
    </form>

    <div class="message" id="message">Loading something nice for you…</div>

    <button onclick="showNote()">A little note for you 💌</button>

    <div class="links">
      <div class="links-row">
        <a href="https://youtube.com" target="_blank">YouTube</a>
        <a href="https://spotify.com" target="_blank">Spotify</a>
        <a href="https://netflix.com" target="_blank">Netflix</a>
      </div>

      <a href="https://lord42m.github.io/srks/#" target="_blank">
        Your Page
      </a>
    </div>
  </div>

  <div class="modal" id="noteModal">
    <div class="modal-content">
      <p>No matter how busy life gets, you are always my favorite thought ❤️</p>
      <button onclick="closeNote()">Close</button>
    </div>
  </div>

  <script>
    /* ⭐ Stars */
    const stars = document.getElementById("stars");
    for (let i = 0; i < 45; i++) {
      const s = document.createElement("div");
      s.className = "star";
      s.style.top = Math.random() * 100 + "%";
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDelay = Math.random() * 4 + "s";
      stars.appendChild(s);
    }

    /* ⌨️ Typing Greeting */
    const hour = new Date().getHours();
    let base = hour < 12 ? "Good Morning" : hour < 18 ? "Good Afternoon" : "Good Evening";
    const greetingText = `${base}, <span>My Love</span>`;
    const greetingEl = document.getElementById("greeting");
    let i = 0;

    function typeGreeting() {
      greetingEl.innerHTML = greetingText.slice(0, i++);
      if (i <= greetingText.length) setTimeout(typeGreeting, 40);
    }
    typeGreeting();

    /* ⏰ Time & Date */
    function updateTime() {
      const now = new Date();
      time.textContent = now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      date.textContent = now.toLocaleDateString([], {
        weekday:"long", month:"long", day:"numeric", year:"numeric"
      });
    }
    setInterval(updateTime, 1000);
    updateTime();

    /* 💬 Daily Quote (cached) */
    const today = new Date().toDateString();
    const savedDate = localStorage.getItem("quoteDate");
    const savedQuote = localStorage.getItem("quoteText");

    if (savedDate === today && savedQuote) {
      message.textContent = savedQuote;
    } else {
      fetch("https://api.quotable.io/random?maxLength=90")
        .then(r => r.json())
        .then(d => {
          const q = `“${d.content}”`;
          localStorage.setItem("quoteText", q);
          localStorage.setItem("quoteDate", today);
          message.textContent = q;
        })
        .catch(() => {
          message.textContent = "You are loved more than you know.";
        });
    }

    /* 💌 Modal */
    function showNote() {
      noteModal.style.display = "flex";
    }

    function closeNote() {
      noteModal.style.display = "none";
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeNote();
    });
  </script>

</body>
</html>
