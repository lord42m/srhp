<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For You ❤️</title>

  <style>
    :root {
      --bg: #0f1115;
      --accent: #ff7a9c;
      --text: #e6e6e6;
      --muted: #a0a0a0;
      --surface: #171a21;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      font-family: "Inter", "Segoe UI", sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    /* 🌌 Stars */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: twinkle 4s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%,100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }

    /* ✨ Glow */
    .glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(
        circle,
        rgba(255,122,156,0.18) 0%,
        rgba(255,122,156,0.08) 35%,
        rgba(255,122,156,0.02) 55%,
        transparent 70%
      );
      filter: blur(90px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    /* 🔗 Top-left links */
    .side-links {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 3;
    }

    .side-links a {
      border: 1px solid var(--muted);
      padding: 8px 16px;
      border-radius: 18px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      transition: 0.3s;
      background: rgba(0,0,0,0.2);
    }

    .side-links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .container {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
      font-weight: 500;
      min-height: 34px;
      text-shadow: 0 0 25px rgba(255,122,156,0.25);
    }

    h1 span { color: var(--accent); }

    .time {
      font-size: 48px;
      font-weight: 600;
      margin: 15px 0 5px;
      text-shadow: 0 0 30px rgba(255,122,156,0.25);
    }

    .date {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .search-box {
      max-width: 520px;
      width: 100%;
      margin: 25px auto;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 30px;
      border: none;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }

    .search-box input:focus {
      box-shadow: 0 0 0 2px rgba(255,122,156,0.3);
    }

    .message {
      margin: 30px 0;
      font-size: 16px;
      min-height: 52px;
    }

    button {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 10px 22px;
      border-radius: 25px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: var(--accent);
      color: #000;
    }

    /* 🔘 Work buttons row */
    .work-links {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .work-links a {
      border: 1px solid var(--muted);
      padding: 8px 18px;
      border-radius: 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      transition: 0.3s;
    }

    .work-links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 💌 Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-content {
      background: var(--surface);
      padding: 26px;
      border-radius: 16px;
      max-width: 300px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <!-- Glow -->
  <div class="glow"></div>

  <!-- Top-left vertical links -->
  <div class="side-links">
    <a href="https://youtube.com" target="_blank">YouTube</a>
    <a href="https://spotify.com" target="_blank">Spotify</a>
    <a href="https://netflix.com" target="_blank">Netflix</a>
    <a href="https://lord42m.github.io/srks/#" target="_blank">Your Page</a>
  </div>

  <div class="container">
    <h1 id="greeting"></h1>

    <div class="time" id="time"></div>
    <div class="date" id="date"></div>

    <form class="search-box" action="https://www.google.com/search">
      <input name="q" placeholder="Search Google…" autofocus />
    </form>

    <div class="message" id="message">Loading something nice for you…</div>

    <button onclick="showNote()">A little note for you 💌</button>

    <!-- Work / App buttons -->
    <div class="work-links">
      <a href="https://sso.unej.ac.id/cas/login?service=https%3A%2F%2Fsiakad.unej.ac.id%2Fsite%2Flogincas" target="_blank">SISTER</a>
      <a href="https://apps.tatamulia.co.id:7443/spk/index.php/login" target="_blank">E-SPK</a>
      <a href="https://login.microsoftonline.com/2affd32c-4aa4-48d4-aecb-b4b5f8394d1d/oauth2/authorize?client_id=996def3d-b36c-4153-8607-a6fd3c01b89f&redirect_uri=https%3A%2F%2Fbusinesscentral.dynamics.com%2Fremote-sign-in&response_type=code&scope=openid%20profile&response_mode=form_post" target="_blank">Dynamic</a>
      <a href="https://mail.tatamulia.co.id/#1" target="_blank">E-Mail</a>
      <a href="http://192.168.9.35/index.php/Base/show_all_aplikasi/" target="_blank">TATA</a>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="noteModal">
    <div class="modal-content">
      <p>No matter how busy life gets, you are always my favorite thought ❤️</p>
      <button onclick="closeNote()">Close</button>
    </div>
  </div>

  <script>
    /* Stars */
    const stars = document.getElementById("stars");
    for (let i = 0; i < 45; i++) {
      const s = document.createElement("div");
      s.className = "star";
      s.style.top = Math.random() * 100 + "%";
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDelay = Math.random() * 4 + "s";
      stars.appendChild(s);
    }

    /* Typing greeting */
    const hour = new Date().getHours();
    const base =
      hour < 12 ? "Good Morning" :
      hour < 18 ? "Good Afternoon" :
      "Good Evening";

    const greetingText = `${base}, <span>My Love</span>`;
    const greetingEl = document.getElementById("greeting");
    let i = 0;

    function typeGreeting() {
      greetingEl.innerHTML = greetingText.slice(0, i++);
      if (i <= greetingText.length) setTimeout(typeGreeting, 40);
    }
    typeGreeting();

    /* Time & Date */
    function updateTime() {
      const now = new Date();
      time.textContent = now.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      date.textContent = now.toLocaleDateString([], {
        weekday:"long", month:"long", day:"numeric", year:"numeric"
      });
    }
    setInterval(updateTime, 1000);
    updateTime();

    /* Daily quote */
    const today = new Date().toDateString();
    const savedDate = localStorage.getItem("quoteDate");
    const savedQuote = localStorage.getItem("quoteText");

    if (savedDate === today && savedQuote) {
      message.textContent = savedQuote;
    } else {
      fetch("https://api.quotable.io/random?maxLength=90")
        .then(r => r.json())
        .then(d => {
          const q = `“${d.content}”`;
          localStorage.setItem("quoteText", q);
          localStorage.setItem("quoteDate", today);
          message.textContent = q;
        })
        .catch(() => {
          message.textContent = "You are loved more than you know.";
        });
    }

    function showNote() {
      noteModal.style.display = "flex";
    }

    function closeNote() {
      noteModal.style.display = "none";
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeNote();
    });
  </script>

</body>
</html>
